<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>737 AMM Reference Search</title>
<style>
:root{
  --bg:#E8EBEE; --card:#FFFFFF; --ink:#10151A; --line:#C9D2DA; --line2:#E2E8ED;
  --blue:#0B4F86; --amber:#9C540E; --slate:#5D6B78; --mark:#FFE08A; --shadow:0 1px 0 rgba(16,21,26,.06);
}
html[data-theme="dark"]{
  --bg:#0F151B; --card:#19212B; --ink:#E7EDF3; --line:#2B3945; --line2:#222E39;
  --blue:#79B8EF; --amber:#E7A45C; --slate:#93A3B1; --mark:#5C4A12; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.35;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 96px}

/* ---- header ---- */
header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding-top:10px;
}
.head-in{max-width:900px;margin:0 auto;padding:0 14px}
.brandrow{display:flex;align-items:baseline;gap:10px;padding-bottom:8px}
.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.brand em{font-style:normal;color:var(--slate);font-weight:600}
.spacer{flex:1}
.themebtn{
  border:1px solid var(--line);background:var(--card);color:var(--slate);
  border-radius:999px;padding:4px 11px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;cursor:pointer
}
.themebtn:hover{color:var(--ink)}

.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:13px;width:19px;height:19px;stroke:var(--slate);fill:none;stroke-width:2}
#q{
  width:100%; padding:14px 44px 14px 42px; font-size:17px;
  background:var(--card); color:var(--ink);
  border:1.5px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
  font-family:inherit;
}
#q:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
#q::placeholder{color:var(--slate)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#clear{
  position:absolute;right:8px;border:0;background:transparent;color:var(--slate);
  font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;display:none
}
#clear:hover{color:var(--ink)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:9px 0 3px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--slate);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap
}
.chip b{font-weight:600;opacity:.6;margin-left:5px;font-size:11px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
html[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F151B}
.chip[aria-pressed="true"] b{opacity:.75}

.statusrow{display:flex;align-items:center;gap:10px;padding:8px 0 10px;font-size:12.5px;color:var(--slate)}
#count{font-weight:700;letter-spacing:.02em}
select{
  margin-left:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;font-size:12.5px;font-family:inherit;max-width:58%
}

/* ---- results ---- */
ul{list-style:none;margin:0;padding:0}
li.hit{
  background:var(--card); border:1px solid var(--line2); border-left:3px solid transparent;
  border-radius:8px; margin-bottom:7px; padding:11px 13px; cursor:pointer;
  box-shadow:var(--shadow); position:relative;
}
li.hit:hover,li.hit.sel{border-left-color:var(--blue)}
li.hit.sel{border-color:var(--blue);border-left-color:var(--blue)}
li.hit:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ref{font-size:17px;font-weight:600;letter-spacing:.01em;color:var(--blue);display:block}
.ref .task{color:var(--amber)}
.title{margin-top:3px;font-size:15px;color:var(--ink)}
.meta{margin-top:4px;font-size:11.5px;color:var(--slate);letter-spacing:.02em}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.copied{
  position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--blue);opacity:0;transition:opacity .15s
}
li.hit.flash .copied{opacity:1}

.empty{padding:44px 10px;text-align:center;color:var(--slate)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.more{text-align:center;padding:14px;color:var(--slate);font-size:13px}
.more button{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit
}
footer{padding:26px 4px;color:var(--slate);font-size:11.5px;line-height:1.6;border-top:1px solid var(--line2);margin-top:18px}
kbd{font-family:ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){ .ref{font-size:16px} .title{font-size:14.5px} }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brandrow">
      <span class="brand">737 AMM <em>/ task index</em></span>
      <span class="spacer"></span>
      <button class="themebtn" id="theme" type="button">Night</button>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Search a system, task, or number">
      <button id="clear" type="button" aria-label="Clear search">&times;</button>
    </div>
    <div class="filters" id="chips"></div>
    <div class="statusrow">
      <span id="count"></span>
      <select id="chap" aria-label="Filter by ATA chapter"><option value="">All chapters</option></select>
    </div>
  </div>
</header>

<main class="wrap">
  <ul id="out"></ul>
  <div id="more"></div>
  <footer>
    Tap any task to copy its AMM reference. <kbd>&uarr;</kbd> <kbd>&darr;</kbd> to move, <kbd>Enter</kbd> to copy, <kbd>Esc</kbd> to clear.<br>
    <span id="stat"></span> Read from the 737 AMM table of contents; applicability blocks and duplicate listings removed.
    Always confirm the current revision in the live manual before you work the task.
  </footer>
</main>

CTION/CHECK","s":"TRANSLATING SLEEVE","c":"78","k":"Inspection/Check"},{"r":"78-31-03-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER HYDRAULIC ACTUATORS","c":"78","k":"Removal/Installation"},{"r":"78-31-03-501","t":"THRUST REVERSER UPPER LOCKING ACTUATOR - INTEGRITY TEST","s":"THRUST REVERSER HYDRAULIC ACTUATORS","c":"78","k":"Adjustment/Test"},{"r":"78-31-03-601","t":"INSPECTION/CHECK","s":"THRUST REVERSER HYDRAULIC ACTUATORS","c":"78","k":"Inspection/Check"},{"r":"78-31-03-801","t":"REPAIRS","s":"THRUST REVERSER HYDRAULIC ACTUATORS","c":"78","k":"Repair"},{"r":"78-31-04-401","t":"REMOVAL/INSTALLATION","s":"SYNC SHAFT","c":"78","k":"Removal/Installation"},{"r":"78-31-04-601","t":"INSPECTION/CHECK","s":"SYNC SHAFT","c":"78","k":"Inspection/Check"},{"r":"78-31-05-401","t":"REMOVAL/INSTALLATION","s":"CASCADES","c":"78","k":"Removal/Installation"},{"r":"78-31-05-601","t":"CASCADE - INSPECTION/CHECK","s":"CASCADES","c":"78","k":"Inspection/Check"},{"r":"78-31-06-401","t":"REMOVAL/INSTALLATION","s":"BLOCKER DOORS","c":"78","k":"Removal/Installation"},{"r":"78-31-06-601","t":"BLOCKER DOOR - INSPECTION/CHECK","s":"BLOCKER DOORS","c":"78","k":"Inspection/Check"},{"r":"78-31-07-201","t":"MAINTENANCE PRACTICES","s":"BLOCKER DOOR DRAG LINKS","c":"78","k":"Maintenance Practices"},{"r":"78-31-07-401","t":"REMOVAL/INSTALLATION","s":"BLOCKER DOOR DRAG LINKS","c":"78","k":"Removal/Installation"},{"r":"78-31-08-201","t":"MAINTENANCE PRACTICES","s":"THRUST REVERSER OPENING ACTUATOR","c":"78","k":"Maintenance Practices"},{"r":"78-31-08-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER OPENING ACTUATOR","c":"78","k":"Removal/Installation"},{"r":"78-31-09-401","t":"KRUEGER FLAP DEFLECTOR, FAIRING AND PLUG - REMOVAL/INSTALLATION","s":"KRUEGER FLAP DEFLECTOR AND FAIRING","c":"78","k":"Removal/Installation"},{"r":"78-31-09-601","t":"INSPECTION/CHECK","s":"KRUEGER FLAP DEFLECTOR AND FAIRING","c":"78","k":"Inspection/Check"},{"r":"78-31-10-401","t":"REMOVAL/INSTALLATION","s":"RUBSTRIP","c":"78","k":"Removal/Installation"},{"r":"78-31-11-401","t":"REMOVAL/INSTALLATION","s":"TENSION LATCHES","c":"78","k":"Removal/Installation"},{"r":"78-31-11-501","t":"TENSION LATCH - ADJUSTMENT/TEST","s":"TENSION LATCHES","c":"78","k":"Adjustment/Test"},{"r":"78-31-12-401","t":"REMOVAL/INSTALLATION","s":"FIRESEAL","c":"78","k":"Removal/Installation"},{"r":"78-31-12-601","t":"INSPECTION/CHECK","s":"FIRESEAL","c":"78","k":"Inspection/Check"},{"r":"78-31-13-401","t":"REMOVAL/INSTALLATION","s":"INSULATION BLANKET","c":"78","k":"Removal/Installation"},{"r":"78-31-13-601","t":"INSPECTION/CHECK","s":"INSULATION BLANKET","c":"78","k":"Inspection/Check"},{"r":"78-31-13-801","t":"REPAIRS","s":"INSULATION BLANKET","c":"78","k":"Repair"},{"r":"78-31-23-401","t":"REMOVAL/INSTALLATION","s":"BULLNOSE SEAL","c":"78","k":"Removal/Installation"},{"r":"78-31-23-601","t":"INSPECTION/CHECK","s":"BULLNOSE SEAL","c":"78","k":"Inspection/Check"},{"r":"78-31-24-401","t":"REMOVAL/INSTALLATION","s":"AERO BLOCKER DOOR SEAL","c":"78","k":"Removal/Installation"},{"r":"78-34-01-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER CONTROL VALVE MODULE","c":"78","k":"Removal/Installation"},{"r":"78-34-02-401","t":"THRUST REVERSER SLEEVE STOW SENSORS - REMOVAL/INSTALLATION","s":"THRUST REVERSER SLEEVE STOW PROXIMITY SENSOR","c":"78","k":"Removal/Installation"},{"r":"78-34-02-501","t":"ADJUSTMENT/TEST","s":"THRUST REVERSER SLEEVE STOW PROXIMITY SENSOR","c":"78","k":"Adjustment/Test"},{"r":"78-34-03-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER SLEEVE LOCK PROXIMITY SENSOR","c":"78","k":"Removal/Installation"},{"r":"78-34-03-501","t":"ADJUSTMENT/TEST","s":"THRUST REVERSER SLEEVE LOCK PROXIMITY SENSOR","c":"78","k":"Adjustment/Test"},{"r":"78-34-04-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER CONTROL SWITCH","c":"78","k":"Removal/Installation"},{"r":"78-34-04-501","t":"ADJUSTMENT/TEST","s":"THRUST REVERSER CONTROL SWITCH","c":"78","k":"Adjustment/Test"},{"r":"78-34-05-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER ARM, STOW AND SYNC LOCK SWITCHES","c":"78","k":"Removal/Installation"},{"r":"78-34-06-401","t":"REMOVAL/INSTALLATION","s":"ENGINE ACCESSORY UNIT","c":"78","k":"Removal/Installation"},{"r":"78-34-07-401","t":"REMOVAL/INSTALLATION","s":"VOLUMETRIC HYDRAULIC FUSES","c":"78","k":"Removal/Installation"},{"r":"78-34-08-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER SHUTTLE VALVE","c":"78","k":"Removal/Installation"},{"r":"78-34-10-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER SYNC LOCK","c":"78","k":"Removal/Installation"},{"r":"78-34-10-501","t":"ADJUSTMENT/TEST","s":"THRUST REVERSER SYNC LOCK","c":"78","k":"Adjustment/Test"},{"r":"78-34-11-401","t":"REMOVAL/INSTALLATION","s":"THRUST REVERSER CONTROL SWITCH ACTUATION SPRING","c":"78","k":"Removal/Installation"},{"r":"78-34-11-601","t":"INSPECTION/CHECK","s":"THRUST REVERSER CONTROL SWITCH ACTUATION SPRING","c":"78","k":"Inspection/Check"},{"r":"78-36-02-401","t":"REMOVAL/INSTALLATION","s":"LINEAR VARIABLE DIFFERENTIAL TRANSFORMER (LVDT","c":"78","k":"Removal/Installation"},{"r":"78-36-02-501","t":"ADJUSTMENT/TEST 3","s":"LINEAR VARIABLE DIFFERENTIAL TRANSFORMER (LVDT","c":"78","k":"Adjustment/Test"},{"r":"79-00-00-601","t":"INSPECTION/CHECK","s":"OIL","c":"79","k":"Inspection/Check"},{"r":"79-00-00-901","t":"DDG MAINTENANCE PROCEDURES","s":"OIL","c":"79","k":"Other"},{"r":"79-11-01-401","t":"REMOVAL/INSTALLATION","s":"OIL TANK","c":"79","k":"Removal/Installation"},{"r":"79-11-01-601","t":"INSPECTION/CHECK","s":"OIL TANK","c":"79","k":"Inspection/Check"},{"r":"79-11-01-701","t":"CLEANING/PAINTING","s":"OIL TANK","c":"79","k":"Cleaning/Painting"},{"r":"79-11-01-801","t":"REPAIRS","s":"OIL TANK","c":"79","k":"Repair"},{"r":"79-21-00-201","t":"MAINTENANCE PRACTICES","s":"OIL DISTRIBUTION","c":"79","k":"Maintenance Practices"},{"r":"79-21-01-401","t":"REMOVAL/INSTALLATION","s":"LUBRICATION UNIT","c":"79","k":"Removal/Installation"},{"r":"79-21-01-801","t":"REPAIRS","s":"LUBRICATION UNIT","c":"79","k":"Repair"},{"r":"79-21-02-401","t":"REMOVAL/INSTALLATION","s":"MAIN OIL/FUEL HEAT EXCHANGER","c":"79","k":"Removal/Installation"},{"r":"79-21-03-401","t":"REMOVAL/INSTALLATION","s":"OIL SUPPLY FILTER","c":"79","k":"Removal/Installation"},{"r":"79-21-04-401","t":"REMOVAL/INSTALLATION","s":"SCAVENGE OIL FILTER ASSEMBLY","c":"79","k":"Removal/Installation"},{"r":"79-21-05-401","t":"CHIP DETECTOR REMOVAL/INSTALLATION","s":"MAGNETIC CHIP DETECTOR","c":"79","k":"Removal/Installation"},{"r":"79-21-06-401","t":"REMOVAL/INSTALLATION","s":"SCAVENGE OIL FILTER ELEMENT","c":"79","k":"Removal/Installation"},{"r":"79-21-07-401","t":"REMOVAL/INSTALLATION","s":"SCAVENGE OIL FILTER CLOGGING TRANSMITTER","c":"79","k":"Removal/Installation"},{"r":"79-21-08-401","t":"REMOVAL/INSTALLATION","s":"DEBRIS MONITORING SYSTEM (DMS) BOX","c":"79","k":"Removal/Installation"},{"r":"79-21-09-401","t":"REMOVAL/INSTALLATION","s":"OIL ANTI-LEAK VALVE","c":"79","k":"Removal/Installation"},{"r":"79-21-10-401","t":"REMOVAL/INSTALLATION","s":"CLOGGING INDICATOR","c":"79","k":"Removal/Installation"},{"r":"79-31-00-501","t":"ADJUSTMENT/TEST","s":"OIL QUANTITY INDICATING SYSTEM","c":"79","k":"Adjustment/Test"},{"r":"79-31-01-401","t":"REMOVAL/INSTALLATION","s":"OIL QUANTITY TRANSMITTER","c":"79","k":"Removal/Installation"},{"r":"79-32-01-401","t":"REMOVAL/INSTALLATION","s":"OIL PRESSURE SENSOR","c":"79","k":"Removal/Installation"},{"r":"79-34-02-401","t":"REMOVAL/INSTALLATION } 5 80 - STARTING","s":"OIL TEMPERATURE SENSOR","c":"79","k":"Removal/Installation"},{"r":"80-00-00-901","t":"DDG MAINTENANCE PROCEDURES","s":"STARTING","c":"80","k":"Other"},{"r":"80-11-00-401","t":"REMOVAL/INSTALLATION","s":"START SWITCH","c":"80","k":"Removal/Installation"},{"r":"80-11-00-501","t":"ADJUSTMENT/TEST","s":"START SWITCH","c":"80","k":"Adjustment/Test"},{"r":"80-11-01-301","t":"SERVICING","s":"STARTER","c":"80","k":"Servicing"},{"r":"80-11-01-401","t":"REMOVAL/INSTALLATION","s":"STARTER","c":"80","k":"Removal/Installation"},{"r":"80-11-01-601","t":"INSPECTION/CHECK","s":"STARTER","c":"80","k":"Inspection/Check"},{"r":"80-11-01-801","t":"REPAIRS","s":"STARTER","c":"80","k":"Repair"},{"r":"80-11-02-401","t":"REMOVAL/INSTALLATION","s":"QAD ADAPTER","c":"80","k":"Removal/Installation"},{"r":"80-11-03-401","t":"REMOVAL/INSTALLATION","s":"START VALVE","c":"80","k":"Removal/Installation"}]};
const REC = DATA.d, CHAP = DATA.ch;
const PAGE = 120;

/* pre-compute one lowercase haystack per record */
REC.forEach(r=>{
  r.n = r.r.replace(/-/g,'');
  r.h = (r.r+' '+r.n+' '+r.t+' '+r.s+' '+r.k+' '+(CHAP[r.c]||'')+' '+r.c).toLowerCase();
  r.tl = r.t.toLowerCase(); r.sl = (r.s||'').toLowerCase();
  /* one strong line: system then what the task does, unless the title already says it */
  const st = r.sl.split(/[^a-z0-9]+/).filter(w=>w.length>3);
  const covered = st.length && st.filter(w=>r.tl.includes(w)).length/st.length >= 0.6;
  r.d = (r.s && !covered) ? r.s + ' \u2014 ' + r.t : r.t;
});

const KINDS = [...new Set(REC.map(r=>r.k))]
  .map(k=>[k, REC.filter(r=>r.k===k).length])
  .sort((a,b)=>b[1]-a[1]);

const $ = s=>document.querySelector(s);
const q=$('#q'), out=$('#out'), chips=$('#chips'), chap=$('#chap'),
      count=$('#count'), moreBox=$('#more'), stat=$('#stat');

let kind='', shown=PAGE, results=REC, sel=-1;

/* chapter dropdown */
[...new Set(REC.map(r=>r.c))].sort().forEach(c=>{
  const o=document.createElement('option');
  o.value=c; o.textContent=c+' — '+(CHAP[c]||'');
  chap.appendChild(o);
});

/* kind chips */
KINDS.forEach(([k,n])=>{
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.setAttribute('aria-pressed','false');
  b.innerHTML = esc(k)+'<b>'+n+'</b>';
  b.onclick=()=>{ kind = (kind===k)?'':k; paintChips(); run(); };
  b.dataset.k=k; chips.appendChild(b);
});
function paintChips(){
  [...chips.children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===kind?'true':'false'));
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function tokens(str){
  return str.toLowerCase().split(/[\s,]+/).filter(Boolean);
}

function score(r,toks,raw){
  let s=0;
  for(const t of toks){
    const nd = t.replace(/-/g,'');
    if(!r.h.includes(t) && !(nd && r.n.includes(nd))) return -1;
    if(r.n.startsWith(nd) && /\d/.test(t)) s+=120;
    else if(nd && r.n.includes(nd) && /\d/.test(t)) s+=70;
    if(r.tl.startsWith(t)) s+=60;
    else if(new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&')).test(r.tl)) s+=42;
    else if(r.tl.includes(t)) s+=18;
    if(r.sl.includes(t)) s+=22;
    if(r.k.toLowerCase().includes(t)) s+=8;
  }
  s -= r.t.length/260;              /* prefer tight titles */
  if(raw && r.tl===raw) s+=40;
  return s;
}

function run(){
  const raw=q.value.trim().toLowerCase(), toks=tokens(raw);
  let list = REC;
  if(kind) list = list.filter(r=>r.k===kind);
  if(chap.value) list = list.filter(r=>r.c===chap.value);
  if(toks.length){
    const scored=[];
    for(const r of list){ const s=score(r,toks,raw); if(s>=0) scored.push([s,r]); }
    scored.sort((a,b)=> b[0]-a[0] || (a[1].r<b[1].r?-1:1));
    list = scored.map(x=>x[1]);
  }
  results=list; shown=PAGE; sel=-1;
  $('#clear').style.display = q.value ? 'block':'none';
  render();
}

function hl(text,toks){
  let s=esc(text);
  toks.forEach(t=>{
    if(t.length<2) return;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&')+')','ig');
    s=s.replace(re,'<mark>$1</mark>');
  });
  return s;
}

function refHTML(ref,toks){
  const p=ref.split('-');
  const head=p.slice(0,3).join('-'), tail=p.slice(3).join('-');
  return hl(head,toks)+'<span class="task">-'+hl(tail,toks)+'</span>';
}

function render(){
  const toks=tokens(q.value.trim());
  count.textContent = results.length.toLocaleString()+' task'+(results.length===1?'':'s');
  stat.textContent = REC.length.toLocaleString()+' unique AMM tasks indexed.';
  if(!results.length){
    out.innerHTML='<li class="empty"><strong>No task matches that.</strong>Try fewer words, a system name (&ldquo;spar valve&rdquo;), or the first digits of the reference.</li>';
    moreBox.innerHTML=''; return;
  }
  const slice=results.slice(0,shown);
  out.innerHTML = slice.map((r,i)=>
    '<li class="hit" tabindex="0" data-i="'+i+'" data-ref="'+esc(r.r)+'">'+
      '<span class="copied">Copied</span>'+
      '<span class="ref mono">'+refHTML(r.r,toks)+'</span>'+
      '<div class="title">'+hl(r.d,toks)+'</div>'+
      '<div class="meta">ATA '+r.c+' &middot; '+esc(CHAP[r.c]||'')+'</div>'+
    '</li>').join('');
  moreBox.innerHTML = results.length>shown
    ? '<div class="more"><button type="button" id="mb">Show '+Math.min(PAGE,results.length-shown)+' more</button><div style="margin-top:7px">'+shown+' of '+results.length+'</div></div>'
    : '';
  const mb=$('#mb'); if(mb) mb.onclick=()=>{shown+=PAGE;render();};
}

function copyRef(li){
  const ref=li.dataset.ref;
  const done=()=>{ li.classList.add('flash'); setTimeout(()=>li.classList.remove('flash'),1100); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ref).then(done,()=>fallback(ref,done));
  } else fallback(ref,done);
}
function fallback(text,done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity=0;
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');done();}catch(e){}
  document.body.removeChild(ta);
}

out.addEventListener('click',e=>{
  const li=e.target.closest('li.hit'); if(li) copyRef(li);
});
out.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const li=e.target.closest('li.hit'); if(li){e.preventDefault();copyRef(li);} }
});

function move(d){
  const items=[...out.querySelectorAll('li.hit')];
  if(!items.length) return;
  sel=Math.max(0,Math.min(items.length-1,sel+d));
  items.forEach(x=>x.classList.remove('sel'));
  items[sel].classList.add('sel');
  items[sel].scrollIntoView({block:'nearest'});
  items[sel].focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();move(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
  else if(e.key==='Escape'){q.value='';q.focus();run();}
  else if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select();}
});

q.addEventListener('input',run);
chap.addEventListener('change',run);
$('#clear').onclick=()=>{q.value='';q.focus();run();};
$('#theme').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  $('#theme').textContent=dark?'Night':'Day';
};

paintChips(); run();
</script>
</body>
